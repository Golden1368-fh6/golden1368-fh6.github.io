<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden1368-fh6 | 个人博客</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0f0f13;
      --bg-card: #1a1a23;
      --bg-hover: #24243a;
      --text: #e8e8f0;
      --text-muted: #8888a0;
      --accent: #6c63ff;
      --accent-glow: rgba(108, 99, 255, 0.15);
      --border: #2a2a3e;
      --gradient-1: linear-gradient(135deg, #6c63ff, #e94560);
      --gradient-2: linear-gradient(135deg, #0f0f13, #1a1a23);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    ::selection {
      background: var(--accent);
      color: #fff;
    }

    /* --- Navigation --- */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(20px);
      background: rgba(15, 15, 19, 0.7);
      border-bottom: 1px solid transparent;
      transition: all 0.3s ease;
    }

    nav.scrolled {
      border-bottom: 1px solid var(--border);
      background: rgba(15, 15, 19, 0.92);
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.3s ease;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--gradient-1);
      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-github {
      display: flex;
      align-items: center;
      line-height: 1;
    }

    .nav-github::after {
      display: none !important;
    }

    .nav-github svg {
      display: block;
    }

    /* --- Hero --- */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, var(--accent-glow) 0%, transparent 50%),
                  radial-gradient(circle at 70% 60%, rgba(233, 69, 96, 0.08) 0%, transparent 50%);
      animation: bgShift 20s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(-5%, -5%) rotate(5deg); }
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero-badge {
      display: inline-block;
      padding: 0.4rem 1.2rem;
      border-radius: 100px;
      background: var(--accent-glow);
      border: 1px solid rgba(108, 99, 255, 0.2);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 1.5rem;
      letter-spacing: 0.5px;
    }

    .hero h1 {
      font-size: clamp(2.8rem, 8vw, 5rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    .hero h1 .highlight {
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--text-muted);
      max-width: 540px;
      margin: 0 auto 2rem;
    }

    .hero-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--gradient-1);
      color: #fff;
      box-shadow: 0 4px 24px rgba(108, 99, 255, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(108, 99, 255, 0.4);
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      background: var(--accent-glow);
      transform: translateY(-2px);
    }

    .scroll-indicator {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      font-size: 0.75rem;
      animation: float 2s ease-in-out infinite;
    }

    .scroll-indicator .line {
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, var(--text-muted), transparent);
    }

    @keyframes float {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(8px); }
    }

    /* --- Sections --- */
    section {
      padding: 6rem 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .section-desc {
      color: var(--text-muted);
      max-width: 560px;
      margin-bottom: 3rem;
      font-size: 1.05rem;
    }

    /* --- About --- */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: center;
    }

    .about-text p {
      color: var(--text-muted);
      margin-bottom: 1.2rem;
      font-size: 1rem;
    }

    .about-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 800;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }

    /* --- Floating Background Keywords --- */
    .bg-keywords {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-keywords span {
      position: absolute;
      font-size: 1rem;
      font-weight: 700;
      color: rgba(108, 99, 255, 0.15);
      letter-spacing: 2px;
      white-space: nowrap;
      animation: keywordFloat 20s linear infinite;
    }

    @keyframes keywordFloat {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }

    /* --- Blog --- */
    .blog-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .blog-post {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.8rem;
      transition: all 0.3s ease;
    }

    .blog-post:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    .blog-post .post-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .blog-post h3 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
    }

    .blog-post p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .blog-post .read-more {
      display: inline-block;
      margin-top: 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }

    .blog-post .read-more:hover {
      text-decoration: underline;
    }

    .blog-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* --- Footer --- */
    footer {
      text-align: center;
      padding: 3rem 2rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    footer .heart {
      color: #e94560;
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      nav {
        padding: 1rem 1.5rem;
      }

      .nav-links {
        display: none;
      }

      .hero h1 {
        font-size: 2.4rem;
      }

      .about-grid {
        grid-template-columns: 1fr;
      }

      .about-stats {
        grid-template-columns: repeat(3, 1fr);
      }

      section {
        padding: 4rem 1.5rem;
      }

      section {
        padding: 4rem 1.5rem;
      }
    }

    /* --- Fade-in animation on scroll --- */
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="bg-keywords" id="bgKeywords"></div>

  <nav id="navbar">
    <a href="#" class="logo">Golden1368-fh6</a>
    <ul class="nav-links">
      <li><a href="#about">关于</a></li>
      <li><a href="#blog">博客</a></li>
      <li><a href="https://github.com/Golden1368-fh6" target="_blank" class="nav-github" title="GitHub">
        <svg viewBox="0 0 16 16" fill="currentColor" width="18" height="18"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a></li>
    </ul>
  </nav>

  <section class="hero" id="home">
    <div class="hero-content">
      <span class="hero-badge">欢迎来到我的世界</span>
      <h1>
        你好, 我是 <span class="highlight">Golden1368-fh6</span>
      </h1>
      <p>一名热爱技术、热衷创造的全栈开发者。用代码构建数字未来，用创意点亮每一行逻辑。</p>
      <div class="hero-actions">
        <a href="https://github.com/Golden1368-fh6" target="_blank" class="btn btn-primary">
          GitHub 主页
        </a>

      </div>
    </div>
    <div class="scroll-indicator">
      <span>向下滚动</span>
      <div class="line"></div>
    </div>
  </section>

  <section id="about">
    <span class="section-label">关于我</span>
    <div>
      <h2 class="section-title">你好，欢迎来到我的空间</h2>
      <p>
        这里是我的个人博客，记录着我感兴趣的技术、思考和创意。
        我相信技术的魅力在于它能让想法变成现实，让世界变得更美好。
      </p>
      <p>
        感谢你的到访，希望在这里能找到一些有趣的内容。
      </p>
    </div>
  </section>

  <section id="blog">
    <span class="section-label">博客</span>
    <h2 class="section-title">最新文章</h2>
    <p class="section-desc">这里将记录我的技术思考与学习笔记。</p>
    <div class="blog-list" id="blogList">
      <div class="blog-empty">
        <p>暂无文章，敬请期待...</p>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Golden1368-fh6. Made with <span class="heart">♥</span></p>
  </footer>

  <script>
    // Navbar scroll effect
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 50);
    });

    // Scroll fade-in animation
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('section > *:not(.section-label)').forEach(el => {
      el.classList.add('fade-in');
      observer.observe(el);
    });

    // Floating background keywords
    const keywords = ['Python', 'Node.js', 'HTML', 'CSS', 'TypeScript', 'React', 'Vue', 'Docker', 'Git', 'MongoDB', 'Linux', 'JavaScript', 'Rust', 'Go', 'Kubernetes', 'Redis', 'GraphQL', 'AWS', 'SQL', 'Nginx', 'Webpack', 'Tailwind', 'Flask', 'Django', 'Next.js', 'NestJS', 'PostgreSQL', 'Figma', 'Sass', 'Deno', 'Express', 'FastAPI', 'Java', 'C++', 'Swift', 'Kotlin', 'Terraform', 'GitHub Actions', 'TypeScript', 'WebAssembly'];
    const container = document.getElementById('bgKeywords');
    keywords.forEach((kw, i) => {
      const el = document.createElement('span');
      el.textContent = kw;
      el.style.left = (5 + Math.random() * 90) + '%';
      el.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
      el.style.animationDuration = (15 + Math.random() * 20) + 's';
      el.style.animationDelay = (Math.random() * 20) + 's';
      container.appendChild(el);
    });

    // Load blog posts from posts/posts.json
    async function loadBlogPosts() {
      const blogList = document.getElementById('blogList');
      try {
        const res = await fetch('posts/posts.json');
        if (!res.ok) throw new Error('Not found');
        const filenames = await res.json();
        const posts = await Promise.all(filenames.map(async (file) => {
          try {
            const htmlRes = await fetch('posts/' + file);
            const html = await htmlRes.text();
            const title = (html.match(/<title>([^<]+)<\/title>/) || [,''])[1].replace(/ - Golden1368-fh6$/, '');
            const date = (html.match(/<meta name="date" content="([^"]+)">/) || [,'Date'])[1];
            const excerpt = ((html.match(/<p>(.*?)<\/p>/) || [,''])[1].replace(/<[^>]+>/g, '') || '阅读全文...');
            return { title, date, excerpt, link: 'posts/' + file };
          } catch { return null; }
        }));
        const validPosts = posts.filter(Boolean).sort((a, b) => b.date.localeCompare(a.date));
        blogList.innerHTML = validPosts.map(post => `
          <article class="blog-post">
            <div class="post-date">${post.date}</div>
            <h3>${post.title}</h3>
            <p>${post.excerpt}</p>
            <a href="${post.link}" class="read-more">阅读更多 →</a>
          </article>
        `).join('');
      } catch {
        blogList.innerHTML = `<div class="blog-empty"><p>暂无文章，敬请期待...</p></div>`;
      }
    }
    loadBlogPosts();
  </script>
</body>
</html>
