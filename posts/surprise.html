<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>惊喜页面</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            font-family: "Microsoft YaHei", sans-serif;
        }
        .page {
            display: none;
            text-align: center;
        }
        .page.active {
            display: block;
        }
        button {
            padding: 16px 40px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(135deg, #667eea, #764ba2);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        button:active {
            transform: translateY(0);
        }
        .surprise-text {
            font-size: 32px;
            color: #333;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <div id="home" class="page active">
        <button onclick="showSurprise()">点开有惊喜</button>
    </div>
    <div id="surprise" class="page">
        <p class="surprise-text">banana有<span id="count"></span>颗搞完！</p>
        <button onclick="goHome()">再来一次</button>
    </div>
    <script>
        function showSurprise() {
            document.getElementById('count').textContent = Math.floor(Math.random() * 1000) + 1;
            document.getElementById('home').classList.remove('active');
            document.getElementById('surprise').classList.add('active');
        }
        function goHome() {
            document.getElementById('surprise').classList.remove('active');
            document.getElementById('home').classList.add('active');
        }
    </script>
</body>
</html>
